# Nginx reverse-proxy for Quantum Portfolio Optimizer
# ─────────────────────────────────────────────────────────────────────────────
# Place this file at:  /etc/nginx/sites-available/quantum-optimizer
# Then enable it:      ln -s /etc/nginx/sites-available/quantum-optimizer \
#                              /etc/nginx/sites-enabled/quantum-optimizer
# And reload Nginx:    nginx -t && systemctl reload nginx
#
# Replace YOURDOMAIN with your actual domain (e.g. optimizer.example.com).
# SSL certificates are provisioned automatically by the setup.sh script
# using Let's Encrypt / Certbot.
# ─────────────────────────────────────────────────────────────────────────────

# Redirect all plain-HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOURDOMAIN www.YOURDOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOURDOMAIN www.YOURDOMAIN;

    # --- SSL (filled in by Certbot automatically) ---
    ssl_certificate     /etc/letsencrypt/live/YOURDOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOURDOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---
    add_header X-Frame-Options       "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy       "no-referrer" always;

    # --- Streamlit proxying (HTTP + WebSocket) ---
    location / {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # WebSocket upgrade — required for Streamlit's live updates
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Long timeouts — QAOA on IBM hardware can take several minutes
        proxy_read_timeout    600s;
        proxy_connect_timeout  75s;
        proxy_send_timeout    600s;

        # Disable buffering so Streamlit spinner updates reach the browser live
        proxy_buffering off;
    }

    # --- Static assets served directly for speed ---
    location ~* \.(ico|css|js|png|jpg|jpeg|gif|svg|woff2?)$ {
        proxy_pass http://127.0.0.1:8501;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # --- Health-check endpoint ---
    location = /healthz {
        proxy_pass http://127.0.0.1:8501/_stcore/health;
    }
}
